# Review the paid service/disk cost in Render before creating resources.
# SQLite needs a persistent disk; a free ephemeral filesystem is not sufficient.
services:
  - type: web
    name: money-runway
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: money-runway-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/money-runway.sqlite
      - key: DEMO_SEED_DATE
        value: "2026-11-10"
      - key: DEMO_USERNAME
        value: judge
      - key: DEMO_PASSWORD
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
