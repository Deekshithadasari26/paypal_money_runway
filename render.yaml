# Free temporary judge demo. SQLite data resets on restart/redeploy/spin-down.
# Use render-persistent.yaml for paid durable SQLite storage.
services:
  - type: web
    name: money-runway-demo
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: ./data/money-runway.sqlite
      - key: TEMPORARY_DEMO
        value: "true"
      - key: DEMO_SEED_DATE
        value: "2026-11-10"
      - key: DEMO_USERNAME
        value: judge
      - key: DEMO_PASSWORD
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
